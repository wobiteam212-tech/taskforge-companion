<section class="board">
  <header class="board-head">
    <a routerLink="/" class="back">Back to projects</a>
    <h2>
      {{ project().name }}
      <tf-badge tone="count">{{ project().openIssues }} open</tf-badge>
    </h2>
    @if (project().description; as desc) {
      <p class="desc">{{ desc }}</p>
    }
  </header>

  <nav class="filters" aria-label="Issue status filter">
    <a routerLink="." [class.on]="!status()">All</a>
    <a routerLink="." [queryParams]="{ status: 'Open' }" [class.on]="status() === 'Open'">Open</a>
    <a routerLink="." [queryParams]="{ status: 'InProgress' }" [class.on]="status() === 'InProgress'">In progress</a>
    <a routerLink="." [queryParams]="{ status: 'Done' }" [class.on]="status() === 'Done'">Done</a>
  </nav>

  <p class="placeholder">
    Showing <strong>{{ status() ?? 'all' }}</strong> issues of project #{{ projectId() }} —
    the real board lands in chapter 13.
  </p>

  <!-- #region step-12.15 -->
  <!-- הלוח עצמו מגיע בפרק 13; חברי הפרויקט הם כבר חלק מהמסך הזה.
       projectId זורם פנימה כ-input — הרכיב לא יודע כלום על הראוטר. -->
  <tf-project-members [projectId]="projectId()" />
  <!-- #endregion -->
</section>
