# #region step-25.5
# nginx עושה שלושה דברים: (1) מגיש את ה-SPA עם fallback ל-index.html כך ש-deep
# links של ה-router עובדים; (2) מעביר /api ל-API; (3) מעביר /hubs ל-API *עם
# שדרוג WebSocket* — בלי זה ה-SignalR של פרק 24 לא יחזיק חיבור.
#
# תופעת לוואי יפה: בפרודקשן הלקוח וה-API חולקים origin (הכול דרך nginx),
# אז ה-CORS מפרק 11 בכלל לא נדרש — אותו origin, אפס preflight.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: כל נתיב שאינו קובץ אמיתי חוזר ל-index.html (ה-router מטפל בו בצד הלקוח)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API: מעבירים ל-service בשם api (ראו docker-compose)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub: אותו proxy, אבל עם הכותרות ששודרגות ל-WebSocket. HTTP/1.1 +
    # Upgrade/Connection הם מה שהופך את החיבור מ-request רגיל ל-socket מתמשך.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}
# #endregion
