<header class="app-header">
  <div class="brand">
    <h1>{{ title() }}</h1>
    <p class="tagline">{{ tagline() }}</p>
  </div>

  <button
    tf-button
    variant="ghost"
    type="button"
    (click)="themeSvc.toggle()"
    [attr.aria-pressed]="themeSvc.theme() === 'light'"
  >
    {{ themeSvc.theme() === 'dark' ? 'Light' : 'Dark' }} mode
  </button>
</header>

<main class="app-main">
  <tf-project-list />
  <router-outlet />
</main>

<tf-toast-container />
