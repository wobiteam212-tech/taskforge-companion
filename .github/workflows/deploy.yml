name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # generate the snapshot manifest, then build the static guide under the
      # repo subpath that GitHub Pages serves it from.
      - run: pnpm gen:manifest
      - run: pnpm exec ng build --base-href=/taskforge-companion/

      # SPA fallback: Pages serves 404.html for unknown paths, so a copy of
      # index.html lets router deep-links + refresh work.
      - run: cp dist/taskforge-companion/browser/index.html dist/taskforge-companion/browser/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/taskforge-companion/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
